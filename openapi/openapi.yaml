components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token (15 min).
    webRefreshCookie:
      type: apiKey
      in: cookie
      name: mb_refresh
      description: httpOnly refresh cookie (web only).
    adminSession:
      type: apiKey
      in: cookie
      name: mb_admin_session
      description: Admin session cookie issued after password + OTP.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on every admin mutation; returned by OTP verify.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Replays return the stored response. Same key + different body → 409 conflict/duplicate.
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag from the last GET; mismatch → 412 conflict/etag-mismatch.
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: validation/invalid
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
    AdminMoney:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          description: Decimal MAJOR units
        currency:
          type: string
          example: USD
    AdminPageMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
    ActionResult:
      type: object
      required:
        - data
        - message
        - auditId
      properties:
        data:
          type: object
          additionalProperties: true
        message:
          type: string
        auditId:
          type: string

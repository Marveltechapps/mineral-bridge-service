openapi: 3.0.3
info:
  title: Mineral Bridge API
  version: 1.0.0
  description: |-
    High-level surface of the Mineral Bridge backend: 106 mobile + 136 web endpoints under `/v1`, 139 admin endpoints under `/admin/v1`.

    Generated by `npm run openapi` from `docs/endpoint-inventory.json` and the live admin route table.
    Field-level request/response shapes live in the API-CONTRACT.md documents of each client.

    **Admin conventions**: money is decimal major units; lists return `{data, meta:{page,pageSize,total,counts?}}`; mutations return `{data, message, auditId}`;
    errors are `{code, message, fields?, details?, requestId}`; edit-gated resources use `ETag` / `If-Match` (412 `conflict/etag-mismatch`);
    state-changing POSTs accept `Idempotency-Key` (required on #52, #72, #106; replays carry `Idempotent-Replay: true`);
    money-moving #32, #52, #72, #106 enforce four-eyes (403 `auth/four-eyes`).
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: mobile
    description: Native mobile app (bearer JWT)
  - name: web
    description: Customer web app (bearer JWT + refresh cookie)
  - name: admin
    description: Operations dashboard (httpOnly session cookie + CSRF double-submit; `x-permission` = module:view|edit)
paths:
  /v1/auth/dev-login:
    get:
      tags: [web, mobile]
      summary: Whether application development login is enabled
      description: Rejected as disabled unless NODE_ENV=development and DEV_LOGIN_ENABLED=true. Clients cannot choose a role.
      security: []
      responses:
        "200":
          description: "{ enabled: boolean, codeLength?: 6 }"
    post:
      tags: [web, mobile]
      summary: Start application development login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Challenge. developmentOtp is returned only by this endpoint.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: auth/dev-login-disabled
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/dev-login/verify:
    post:
      tags: [web, mobile]
      summary: Verify the application development code and issue the normal customer session
      security: []
      responses:
        "200":
          description: Same customer session as POST /v1/auth/otp/verify. developmentOtp is omitted.
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /admin/v1/auth/dev-login:
    get:
      tags: [admin]
      summary: Whether admin development login is enabled
      security: []
      responses:
        "200":
          description: "{ enabled: boolean, codeLength?: 6 }"
    post:
      tags: [admin]
      summary: Start admin development login
      security: []
      responses:
        "200":
          description: Challenge. developmentOtp is returned only by this endpoint.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: auth/dev-login-disabled
  /admin/v1/auth/dev-login/verify:
    post:
      tags: [admin]
      summary: Verify the admin development code and issue the normal staff session
      security: []
      responses:
        "200":
          description: Same { me, redirectTo } body as POST /admin/v1/auth/otp/verify.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/auth/otp/request:
    post:
      tags:
        - mobile
        - web
      operationId: mobile_post_v1AuthOtpRequest
      summary: Send a 6-digit SMS code to a number; `intent` is `signup` or `login`
      description: "Domain: Authentication & Session"
      security: []
      x-endpointNumbers:
        mobile: 1
        web: 2

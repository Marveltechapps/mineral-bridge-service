# Single-node MongoDB replica set (transactions need a replica set).
# The member is advertised as 127.0.0.1 so a host-side Node process (Windows/macOS/Linux) can reach it;
# clients connect with ?directConnection=true so no topology discovery is attempted.
services:
  mongo:
    image: mongo:7
    container_name: mineralbridge-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once a primary exists.
      test: >
        mongosh --quiet --eval "
        try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'127.0.0.1:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build: .
    profiles: ["full"]
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mineralbridge?directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data: